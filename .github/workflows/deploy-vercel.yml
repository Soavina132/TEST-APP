name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install & Build
        run: pnpm install --no-frozen-lockfile && pnpm run build
        env:
          VITE_SUPABASE_URL: https://gifwfjgciwbsottztzoc.supabase.co
          VITE_SUPABASE_PROJECT_ID: gifwfjgciwbsottztzoc
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
          vercel-org-id: team_HLqeCMkbBfUZFCV0QBJkcMqY
          vercel-project-id: prj_HHrBjM8reyQfUZf7fVvQZil3j7si
          vercel-args: '--prod'
