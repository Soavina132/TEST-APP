name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install & Build
        run: pnpm install --no-frozen-lockfile && pnpm run build
        env:
          VITE_SUPABASE_URL: https://gifwfjgciwbsottztzoc.supabase.co
          VITE_SUPABASE_PROJECT_ID: gifwfjgciwbsottztzoc
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (prebuilt)
        run: |
          mkdir -p .vercel && cp -R lalaomada/.vercel/output .vercel/output
          vercel deploy --prebuilt --yes --prod --token "${{ secrets.VERCEL_DEPLOY_TOKEN }}" --project test-app
        env:
          VERCEL_ORG_ID: team_HLqeCMkbBfUZFCV0QBJkcMqY
          VERCEL_PROJECT_ID: prj_HHrBjM8reyQfUZf7fVvQZil3j7si
